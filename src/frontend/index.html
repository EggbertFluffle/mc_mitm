<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
    <title>Minecraft Man-In-The-Middle</title>
</head>
<body>
	<h1>Minecraft Man-In-The-Middle</h1>
	<main>
		<section class="map-section">
			<canvas id="coord-map"></canvas>

			<div class="coords rows">
				<p id="cursor-coords">Mouse Coords: (0.000, 0.000)</p>
				<p id="player-coords">Player Coords: (0.00000, 0.00000)</p>
			</div>

			<div class="map-buttons">
				<button id="toggle-crosshair" aria-pressed="true">Toggle Crosshair</button>
				<button id="center-marker">Center Marker</button>
				<button id="follow-player" aria-pressed="false">Follow Player</button>
			</div>
		</section>
		<section class="data-section">
			<header>
				<h2>
					Designed by Adrian Cervera and Harrison DiAmbrosio
					for WPI CS 584: Computer Networks
				</h2>
			</header>
			<div class="ip-data">
				<p>Client IP: <span id="client-ip">...</span></p>
				<p>Server IP: <span id="server-ip">...</span></p>
				<p>Seed: <span id="seed">...</span></p>
			</div>
			<div class="log">
				<h3>Log</h3>
				<div class="log-body" id="action-log" data-empty="No actions logged yet."></div>
			</div>
		</section>
	</main>

    <script type="module" src="worldmap.js"></script>
	<script type="module" src="api.js"></script>
</body>
</html>
